<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>MATCHON Manager</title>
    <style>
      :root {
        --primary: #0a47ff;
        --navy: #001c7a;
        --bg: #f8fafc;
        --text: #0f172a;
        --secondary: #64748b;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        color: var(--navy);
      }
      p {
        margin: 0 0 12px;
        color: var(--secondary);
        line-height: 1.55;
        font-size: 0.95rem;
      }
      .meta {
        margin-top: 16px;
        font-size: 0.75rem;
        color: var(--secondary);
      }
      button {
        margin-top: 8px;
        width: 100%;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        padding: 12px 16px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MATCHON Manager</h1>
      <p>MATCHON 서버에 연결할 수 없습니다.</p>
      <p>인터넷 연결을 확인한 후 다시 시도해 주세요.</p>
      <button id="retry" type="button">다시 시도</button>
      <div class="meta" id="meta"></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const version = params.get("v") || "";
      const env = params.get("env") || "";
      const meta = document.getElementById("meta");
      function stamp() {
        const now = new Date().toLocaleString("ko-KR");
        meta.textContent = [
          version ? "앱 버전 " + version : null,
          env ? "환경 " + env : null,
          "마지막 재시도 " + now,
        ]
          .filter(Boolean)
          .join(" · ");
      }
      stamp();
      document.getElementById("retry").addEventListener("click", function () {
        stamp();
        if (window.matchonDesktop && window.matchonDesktop.retryConnection) {
          window.matchonDesktop.retryConnection();
        }
      });
    </script>
  </body>
</html>
