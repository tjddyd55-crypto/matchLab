name: Golden Flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLDEN_FLOW_CI: "1"
  MATCHON_GOLDEN_TEST_AUTH: "1"
  MATCHON_GOLDEN_TEST_AUTH_SECRET: ci-golden-test-auth-secret
  AUTH_SECRET: ci-golden-flow-auth-secret-32chars-min
  NEXTAUTH_SECRET: ci-golden-flow-nextauth-secret
  MATCHON_PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  CREDIT_LEDGER_HMAC_SECRET: ci-golden-flow-ledger-hmac-secret
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key

jobs:
  golden-services:
    name: Golden Flow (services)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: matchon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/matchon_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/matchon_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Baseline migration is a no-op marker; empty CI postgres needs schema via db push.
      - name: Provision database schema (CI)
        run: npm run db:push

      - name: Seed Golden Flow
        run: npm run seed:golden -- --ci

      - name: Verify Golden Flow services
        run: npm run verify:golden-flow-services

      - name: Upload golden context (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-flow-context
          path: test-results/golden-flow/
          if-no-files-found: ignore

  golden-browser:
    name: Golden Flow (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: matchon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/matchon_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/matchon_ci
      QA_BASE_URL: http://127.0.0.1:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Provision database schema (CI)
        run: npm run db:push

      - name: Seed Golden Flow
        run: npm run seed:golden -- --ci

      - name: Build application (production server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Verify golden test auth safety
        run: npm run verify:golden-test-auth-safety

      - name: Run Golden Flow browser mutations
        run: npx playwright test -c playwright.golden.config.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-flow-playwright
          path: |
            test-results/golden-flow/
          if-no-files-found: ignore
